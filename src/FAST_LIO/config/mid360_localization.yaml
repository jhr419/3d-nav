/**:
    ros__parameters:
        feature_extract_enable: false     # 是否开启点云特征提取
        point_filter_num: 3               # 点云降采样间隔，每隔多少个点取一个
        max_iteration: 3                  # EKF 单帧最大迭代次数
        filter_size_surf: 0.5             # 当前帧平面点体素滤波尺寸，单位 m
        filter_size_map: 0.5              # 地图点云体素滤波尺寸，单位 m
        cube_side_length: 1000.0          # 局部地图立方体边长，单位 m
        runtime_pos_log_enable: false     # 是否记录运行时位姿日志
        map_file_path: "/home/jhr/fast_ws/src/mapping_adapter/maps/map.pcd"       # 保存 PCD 地图文件路径

        common:
            lid_topic:  "/livox/lidar"    # 雷达点云话题
            imu_topic:  "/livox/imu"      # IMU 话题
            time_sync_en: false           # 是否启用软件时间同步，仅在没有外部硬件同步时开启
            time_offset_lidar_to_imu: 0.0 # 雷达到 IMU 的时间偏移，单位 s；未知时保持 0

        rosbag:
            enable: false                  # 是否直接读取 ros2 bag 建图；true 时不需要 ros2 bag play
            path: "/media/jhr/T9/Datasets/Indoor_Office/cu_indoor_office/"                       # ros2 bag 目录路径，例如 /home/user/data/bag_0
            storage_id: "sqlite3"          # rosbag2 存储后端，常见为 sqlite3 或 mcap
            auto_shutdown: true            # bag 读取完成后是否自动退出节点并保存地图

        localization:
            odom_only_mode: true           # 定位前端轻量模式：只发布 /Odometry 和 /cloud_registered_body，不构建 FAST-LIO 地图

        preprocess:
            lidar_type: 1                  # 雷达类型：1 Livox，2 Velodyne，3 Ouster，4 其他 PointCloud2
            scan_line:  4                  # 雷达扫描线数，MID360 常用 4
            blind: 0.5                     # 盲区距离，小于该距离的点会被过滤，单位 m
            timestamp_unit: 3              # 点云时间戳单位：0 s，1 ms，2 us，3 ns
            scan_rate: 10                  # 雷达扫描频率，单位 Hz
            # input_rotation_rpy_rad: [0.0, 0.485596, 0.0] # 输入雷达和 IMU 同步旋转角 [roll, pitch, yaw]，单位 rad
            input_rotation_rpy_rad: [-0.034101, 0.566395, 0.0]
        mapping:
            acc_cov: 0.1                   # 加速度计噪声协方差
            gyr_cov: 0.1                   # 陀螺仪噪声协方差
            b_acc_cov: 0.0001              # 加速度计零偏随机游走协方差
            b_gyr_cov: 0.0001              # 陀螺仪零偏随机游走协方差
            fov_degree:    360.0           # 建图视场角，单位 deg
            det_range:     100.0           # 有效探测距离，单位 m
            height_filter_en: false         # 是否开启输出地图高度过滤，只发布/保存 h_min 到 h_max 的地图点
            height_filter_  l_map_en: false # 是否同时过滤定位用局部地图；开启可能减少约束并导致漂移
            h_min: -10.0                   # 地图高度过滤下限，世界坐标系 z，单位 m
            h_max: 0.35                    # 地图高度过滤上限，世界坐标系 z，单位 m
            # 减少动态点入图
            dynamic_filter_en: true        # 是否开启近场动态点入图抑制，减少跟随人员等临时物体写入地图
            dynamic_filter_min_range: 0.5  # 动态过滤起始距离，雷达坐标系欧氏距离，单位 m
            dynamic_filter_max_range: 4.0  # 动态过滤最远距离；跟随建图人员通常在 1-3m 内
            dynamic_filter_search_radius: 0.6 # 世界坐标系历史地图支撑搜索半径，单位 m
            dynamic_filter_min_neighbors: 3 # 搜索半径内至少多少个历史地图点才允许写入地图
            extrinsic_est_en:  true        # 是否在线估计 IMU 到雷达外参
            extrinsic_T: [ -0.011, -0.02329, 0.04412 ] # 雷达到 IMU 的平移外参
            extrinsic_R: [ 1., 0., 0.,
                            0., 1., 0.,
                            0., 0., 1.]    # 雷达到 IMU 的旋转外参

        publish:
            path_en: true                  # 是否发布轨迹 Path
            effect_map_en: false           # 是否发布参与匹配的有效点云
            map_en: false                  # 定位模式不发布 FAST-LIO 地图
            scan_publish_en:  true        # 定位模式不发布世界系配准点云，减少计算和内存占用
            dense_publish_en: true         # 是否发布稠密点云；false 会减少全局点云数量
            scan_bodyframe_pub_en: true    # 是否发布 IMU 机体系下的当前帧点云

        pcd_save:
            pcd_save_en: false             # 定位模式不保存 PCD 地图
            pcd_save_enable: 0             # 定位模式关闭 PCD 保存开关
            interval: -1                   # 每多少帧保存一个 PCD；-1 表示全部保存到一个文件，数据量大时可能占用较多内存
