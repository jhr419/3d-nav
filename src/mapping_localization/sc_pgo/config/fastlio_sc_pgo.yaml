sc_pgo_node:
  ros__parameters:
    # 输入话题：FAST-LIO2 在 laserMapping.cpp 中发布这些绝对话题。
    # FAST-LIO2 里程计话题，通常表示 camera_init -> body 的位姿。
    odom_topic: "/Odometry"
    # FAST-LIO2 当前帧 body 坐标系点云，用于保存关键帧、ICP 验证和拼接优化后地图。
    cloud_topic: "/cloud_registered_body"
    # Scan Context 专用点云话题；为空时复用 cloud_topic。
    # 如果后续有雷达自身坐标系点云，可填该话题以提升 Scan Context 表现。
    scan_context_cloud_topic: ""

    # 坐标系设置：FAST-LIO2 默认地图坐标系为 camera_init。
    # 优化后里程计、轨迹和地图发布所在坐标系。
    map_frame: "camera_init"
    # PGO 优化后位姿 TF/odom 的子坐标系名称。
    pgo_child_frame: "aft_pgo"
    # 是否发布 map_frame -> pgo_child_frame 的 TF。
    publish_tf: true

    # GPS 高度约束开关；当前默认关闭。
    # 开启后会用 NavSatFix 的 altitude 给 GTSAM 添加高度约束，XY 方向噪声很大。
    use_gps: false
    # GPS 话题，仅 use_gps=true 时使用。
    gps_topic: "/gps/fix"

    # 订阅/同步缓存设置。
    # ROS 话题队列长度。
    topic_queue_size: 100
    # 内部缓存最大长度，过大占内存，过小可能丢同步数据。
    max_buffer_size: 300
    # 里程计和点云时间同步容差，单位 s。
    sync_time_tolerance_s: 0.08

    # 关键帧选取阈值。
    # 累计平移超过该距离后新增关键帧，单位 m。
    keyframe_meter_gap: 0.5
    # 累计旋转超过该角度后新增关键帧，单位 deg。
    keyframe_deg_gap: 10.0
    # 点云点数少于该值时不作为关键帧，避免空帧/坏帧入图。
    keyframe_min_points: 100

    # 点云降采样参数。
    # 生成 Scan Context 和 ICP 子图前的体素滤波尺寸，单位 m。
    scan_context_leaf_size: 0.4
    # 发布 /aft_pgo_map 前的全局地图体素滤波尺寸，单位 m。
    map_visualization_leaf_size: 0.4
    # 发布全局地图时每隔多少个关键帧取一个，降低可视化计算量。
    map_keyframe_skip: 2

    # Scan Context 回环检测参数。
    # Scan Context 距离阈值，越小越保守；室内或误检多时可降低到 0.1~0.2。
    sc_dist_thres: 0.3
    # Scan Context 最大半径，单位 m；室外可用 80，室内可改为 20~40。
    sc_max_radius: 20.0
    # 生成 Scan Context 时给点云 z 值增加的雷达高度，沿用原 SC-PGO 默认值。
    sc_lidar_height: 2.0
    # 回环检索时排除最近的关键帧数量，避免相邻帧被误认为回环。
    sc_num_exclude_recent: 30
    # KD-Tree 取出的候选回环数量。
    sc_num_candidates: 3
    # 每隔多少次检测重建一次 Scan Context KD-Tree。
    sc_tree_making_period: 30
    # 是否打印 Scan Context 内部耗时调试信息。
    sc_debug_timing: false
    # 是否启用 Scan Context + ICP 回环检测。
    enable_loop_closure: true

    # 回环 ICP 验证参数。
    # Scan Context 回环检测周期，单位 s。
    loop_detection_period_s: 1.0
    # ICP 队列处理周期，单位 s。
    loop_icp_period_s: 0.05
    # 构建历史回环子图时，向前后各取多少个关键帧。
    loop_icp_history_search_num: 25
    # ICP 最大对应点距离，单位 m；原 SC-PGO 使用较大值以覆盖子图范围。
    loop_icp_max_correspondence_distance: 150.0
    # ICP 最大迭代次数。
    loop_icp_max_iterations: 100
    # ICP fitness 阈值，超过则拒绝该回环约束。
    loop_icp_fitness_score_threshold: 0.3

    # 定时器频率设置。
    # 处理里程计/点云同步队列的周期，单位 s。
    process_period_s: 0.005
    # iSAM2 优化周期，单位 s。
    isam_update_period_s: 1.0
    # 发布 /aft_pgo_odom 和 /aft_pgo_path 的周期，单位 s。
    path_publish_period_s: 0.1
    # 发布 /aft_pgo_map 的周期，单位 s；地图拼接较重，不宜太高。
    map_publish_period_s: 10.0

    # 保存设置。
    # 保存目录；相对路径会相对于启动命令所在工作目录解析。
    save_directory: "maps/sc_pgo"
    # 是否保存每个关键帧点云到 save_directory/Scans。
    save_scans: true
    # 启动时是否清空旧的 Scans 目录，避免混入上次运行的数据。
    reset_scan_directory_on_start: true

    # GTSAM 噪声模型方差。
    # PriorFactor 初始位姿约束方差，顺序为 6 维 Pose3 误差。
    prior_variances: [1.0e-12, 1.0e-12, 1.0e-12, 1.0e-12, 1.0e-12, 1.0e-12]
    # 相邻关键帧里程计 BetweenFactor 方差。
    odom_variances: [1.0e-6, 1.0e-6, 1.0e-6, 1.0e-4, 1.0e-4, 1.0e-4]
    # 回环 BetweenFactor 鲁棒核方差。
    loop_variances: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5]
    # GPSFactor 鲁棒核方差；默认 XY 极大，只主要约束高度。
    gps_variances: [1.0e9, 1.0e9, 250.0]
