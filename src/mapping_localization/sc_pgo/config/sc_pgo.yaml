sc_pgo_node:
  ros__parameters:
    # =========================
    # FAST-LIO2 前端输出话题
    # =========================
    # FAST-LIO2 发布的前端里程计，类型 nav_msgs/msg/Odometry
    odom_topic: "/Odometry"
    # FAST-LIO2 发布的配准/去畸变点云，类型 sensor_msgs/msg/PointCloud2
    cloud_topic: "/cloud_registered"
    # FAST-LIO2 发布的原始建图点云地图；SC-PGO 当前只作为参考配置，不直接依赖该话题
    map_topic: "/Laser_map"
    # 用于生成后端关键帧的点云话题；FAST-LIO2 没有独立 keyframe cloud，所以默认复用 /cloud_registered
    keyframe_cloud_topic: "/cloud_registered"

    # =========================
    # 坐标系配置
    # =========================
    # 后端优化地图坐标系。SC-PGO 的优化轨迹、优化地图和回环 marker 都发布在该坐标系下
    map_frame: "map"
    # FAST-LIO2 的连续前端里程计坐标系。当前 FAST-LIO2 发布 camera_init -> body
    odom_frame: "camera_init"
    # 机器人/IMU 机体系。当前 FAST-LIO2 里程计 child_frame_id 为 body
    base_frame: "body"
    # 雷达坐标系名称；当输入 keyframe cloud 的 frame_id 等于该值时，会被认为已经是局部点云
    lidar_frame: "livox_frame"

    # 是否发布 TF
    publish_tf: true
    # 是否发布 map -> odom_frame 修正。推荐开启，让 FAST-LIO 保持发布 camera_init -> body
    publish_map_to_odom: true
    # /cloud_registered 默认已经在 FAST-LIO 世界系 camera_init 下，因此需要先反变换回关键帧局部坐标
    cloud_in_world_frame: true

    # =========================
    # 关键帧选择参数
    # =========================
    # 距离阈值，单位 m；相对上一关键帧平移超过该值时新增关键帧
    keyframe_distance_thresh: 1.0
    # 角度阈值，单位 deg；相对上一关键帧旋转超过该值时新增关键帧
    keyframe_angle_thresh_deg: 10.0
    # 时间阈值，单位 s；即使位姿变化较小，超过该时间也会新增关键帧
    keyframe_time_thresh: 1.0
    # 保存关键帧点云前的体素降采样尺寸，单位 m
    keyframe_cloud_voxel_size: 0.5

    # =========================
    # Scan Context 回环检测参数
    # =========================
    # 是否启用 Scan Context 回环检测
    loop_detect_enabled: true
    # 回环检测频率，单位 Hz；避免每个关键帧都做全量检测
    loop_detect_frequency: 1.0
    # 排除最近多少个关键帧，避免把相邻帧误判为回环
    loop_exclude_recent_num: 30
    # 每次最多保留多少个历史候选用于相似度筛选
    loop_candidate_num: 10
    # Scan Context 距离阈值，越小越严格；候选距离小于该值才进入 ICP 验证
    loop_score_threshold: 0.15
    # 楼层/高度过滤阈值，单位 m；两个候选关键帧 z 差超过该值时拒绝回环
    floor_height_threshold: 4.0

    # 雷达安装高度补偿，单位 m；用于 Scan Context 高度栅格
    sc_lidar_height: 0.0
    # Scan Context 最大半径，单位 m
    sc_max_radius: 80.0
    # Scan Context 径向环数
    sc_num_rings: 20
    # Scan Context 角向扇区数
    sc_num_sectors: 60
    # 预留参数：搜索树深度，当前轻量实现中主要保留为兼容配置
    sc_tree_depth: 20
    # 按历史关键帧比例扩展候选搜索范围，0.1 表示最多额外考虑约 10% 历史候选
    sc_search_ratio: 0.1

    # =========================
    # ICP 回环精配准参数
    # =========================
    # ICP 最大对应点距离，单位 m
    loop_icp_max_corr_dist: 2.0
    # ICP fitness 阈值，越小越严格；超过该值的回环候选会被拒绝
    loop_icp_fitness_threshold: 0.4
    # ICP 最大迭代次数
    loop_icp_max_iterations: 50
    # 构建回环局部子地图时，当前/候选关键帧前后各取多少帧
    loop_submap_nearby_frames: 10

    # =========================
    # GTSAM 位姿图噪声参数
    # =========================
    # 相邻关键帧里程计约束的平移噪声标准差，单位 m
    odom_trans_noise: 0.1
    # 相邻关键帧里程计约束的旋转噪声标准差，单位 rad
    odom_rot_noise: 0.05
    # 回环约束基础噪声标准差；实际会根据 ICP fitness 做适度放大
    loop_noise: 0.5

    # =========================
    # 优化结果发布和保存
    # =========================
    # 优化地图发布频率，单位 Hz；0.2 表示约 5 秒发布一次
    optimized_map_publish_frequency: 0.2
    # 优化地图拼接后的体素降采样尺寸，单位 m
    optimized_map_voxel_size: 0.2
    # 是否保存优化后的地图和轨迹
    save_optimized_map: true
    # 保存目录；输出 optimized_map.pcd 和 optimized_trajectory.txt
    save_directory: "/home/jhr/3dnav_ws/maps/pgo"
