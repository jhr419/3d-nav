ego_local_planner_node:
  ros__parameters:
    map_frame: "map"
    odom_frame: "odom"
    base_frame: "base_link"
    base_frame_candidates: "base_link,base_footprint,odin1_base_link"
    lidar_frame: "livox_frame"

    global_path_topic: "/planned_path"
    pointcloud_topic: "/livox/lidar"
    additional_pointcloud_topics: "/cloud_registered,/cloud_registered_body,/mid360"
    static_pointcloud_topics: "/global_points"
    pointcloud_frame_remaps: "body:livox_frame"
    pointcloud_map_frame_aliases: "camera_init"
    require_fresh_cloud: true
    odom_topic: "/Odometry"
    cmd_vel_topic: "/cmd_vel_nav"

    ego_local_trajectory_topic: "/ego_local_trajectory"
    ego_local_trajectory_marker_topic: "/ego_local_trajectory_marker"
    ego_local_map_vis_topic: "/ego_local_map_vis"
    ego_target_marker_topic: "/ego_local_target_marker"
    ego_candidate_trajectories_marker_topic: "/ego_candidate_trajectories_marker"
    ego_local_map_marker_topic: "/ego_local_map_marker"
    ego_collision_points_marker_topic: "/ego_collision_points_marker"
    ego_footprint_marker_topic: "/ego_footprint_marker"
    ego_cmd_vel_marker_topic: "/ego_cmd_vel_marker"
    status_topic: "/ego_local_planner/status"
    debug_topic: "/ego_debug_text"

    robot_model: "ground_omni"
    allow_z_motion: false

    cloud_in_sensor_frame: true
    local_map_radius: 5.0
    local_map_height: 1.5
    voxel_resolution: 0.15
    inflation_radius: 0.35
    robot_clear_radius: 0.35
    astar_search_margin: 1.0

    remove_ground_points: true
    ground_relative_to_base: true
    ground_z_threshold: 0.18
    ground_filter_use_path_z: true
    self_filter_radius: 0.45
    dynamic_obstacle_timeout: 0.5

    local_target_lookahead: 1.4
    min_local_target_lookahead: 0.4
    goal_reached_tolerance: 0.35
    goal_reached_z_tolerance: 0.45
    z_following_enabled: true
    max_allowed_z_jump: 0.35
    z_aware_path_tracking: true
    path_nearest_z_weight: 1.0
    reference_z_weight: 1.0
    limit_local_target_by_z: true
    local_target_max_z_delta: 0.35

    max_vel_x: 0.2
    max_vel_y: 0.1
    max_acc_x: 0.2
    max_acc_y: 0.2
    max_yaw_rate: 1.0
    max_yaw_acc: 1.5

    traj_tracking_lookahead_time: 0.2
    traj_tracking_lookahead_distance: 0.35
    line_of_sight_tracking: true
    cmd_collision_check_time: 0.6
    kp_x: 0.8
    kp_y: 0.8
    kp_yaw: 1.2
    min_cmd_vel: 0.03
    max_cmd_vel_x: 0.4
    max_cmd_vel_y: 0.2
    max_cmd_wz: 1.0

    replan_frequency: 20.0
    control_frequency: 20.0
    collision_check_frequency: 20.0
    replan_on_dynamic_obstacle: true
    replan_when_path_blocked: true
    path_block_check_distance: 3.0

    use_global_path_risk: true
    allow_deviation_from_global_path: true
    max_deviation_from_global_path: 0.5
    prefer_high_clearance_tracking: true
    min_local_clearance: 0.35
    preferred_local_clearance: 0.75
    local_clearance_weight: 3.0
    path_tracking_weight: 1.0
    slow_down_near_obstacle: true
    obstacle_slow_distance: 0.8
    obstacle_stop_distance: 0.35
    debug_visualization_enabled: true
    footprint_height: 0.55
    static_map_update_distance: 0.25

    local_planner_logging:
      enabled: true
      log_dir: "debug/logs/local_planner"
      log_file_prefix: "local_planner"
      log_format: "text"
      also_log_to_console: false

      periodic_summary_enabled: true
      summary_log_interval_sec: 1.0
      repeated_warning_throttle_sec: 2.0

      pose_change_log_threshold: 0.2
      target_change_log_threshold: 0.3
      cmd_change_log_threshold: 0.05
      obstacle_distance_change_log_threshold: 0.2

      flush_interval_sec: 2.0
      flush_on_error: true

      max_log_file_size_mb: 50.0
      max_log_files: 20
