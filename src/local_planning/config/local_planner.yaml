local_planner_node:
  ros__parameters:
    map_frame: "map"
    base_frame: "base_link"
    base_frame_candidates: "base_link,base_footprint"

    global_path_topic: "/planned_path"
    additional_global_path_topic: "/global_path_3d"
    cmd_vel_topic: "/cmd_vel"
    odom_topic: "/odom"
    sport_mode_state_topic: "/sportmodestate"
    velocity_source: "sport_mode"  # auto / sport_mode / odom / last_cmd / zero
    local_obstacle_cloud_topic: "/local_obstacle_cloud"
    octomap_topic: "/octomap"

    local_trajectory_marker_topic: "/local_trajectory_marker"
    candidate_trajectories_topic: "/dwa_candidate_trajectories"
    local_goal_marker_topic: "/local_goal_marker"
    recovery_trajectory_marker_topic: "/recovery_trajectory_marker"
    path_corridor_marker_topic: "/path_corridor_marker"
    dwa_debug_text_topic: "/dwa_debug_text"

    robot_model: "ground_omni"   # ground_omni / ground_diff / aerial_3d

    obstacle_source: "octomap"   # octomap / pointcloud / both
    octomap_file: "/home/jhr/3dnav_ws/maps/result_cleaned.bt"
    unknown_as_occupied: false
    robot_radius: 0.2
    robot_height: 0.25
    collision_z_offset: 0.10
    safety_margin: 0.05

    control_frequency: 10.0
    sim_time: 1.2
    sim_dt: 0.2

    max_vx: 0.6
    min_vx: -0.2
    max_vy: 0.4
    min_vy: -0.4
    max_wz: 1.0
    min_wz: -1.0

    max_acc_vx: 0.5
    max_acc_vy: 0.5
    max_acc_wz: 1.5

    vx_samples: 5
    vy_samples: 5
    wz_samples: 7

    local_goal_lookahead: 1.5
    goal_reached_tolerance: 0.3
    path_prune_distance: 0.5

    weight_path_distance: 1.0
    weight_goal_distance: 1.2
    weight_obstacle_distance: 1.5
    weight_heading: 0.5
    weight_velocity: 0.2
    weight_smoothness: 0.2

    obstacle_check_resolution: 0.2
    min_obstacle_distance: 0.10
    obstacle_score_distance: 1.0
    stop_on_no_valid_trajectory: true

    use_path_z_for_collision: true
    terrain_following_enabled: true
    z_search_radius: 0.6
    max_allowed_z_jump: 0.35
    slope_edge_z_tolerance: 0.45

    collision_model: "terrain_adaptive_cylinder"
    ground_clearance: 0.05
    body_z_offset: 0.10
    ignore_ground_below_base: true
    ground_ignore_depth: 0.15
    slope_edge_relaxation_enabled: true
    slope_edge_relaxation_radius: 0.25

    unknown_policy: "path_corridor_free"
    path_corridor_radius: 0.5

    adaptive_lookahead_enabled: true
    min_local_goal_lookahead: 0.4
    max_local_goal_lookahead: 1.8
    z_change_slowdown_threshold: 0.25

    recovery_enabled: true
    stuck_detection_enabled: true
    stuck_time_threshold: 2.0
    min_progress_distance: 0.05
    recovery_duration: 1.0
    enable_reverse_escape: true
    enable_lateral_escape: true
    enable_rotate_escape: true

    near_path_bonus_enabled: true
    near_path_bonus_radius: 0.4
    weight_path_corridor: 1.0
    weight_z_consistency: 0.8
    weight_progress: 1.0

    debug_dwa: true
    debug_collision: true

    publish_candidate_trajectories: true
    candidate_marker_stride: 2
    marker_lifetime: 0.4
    tf_timeout: 0.05
    odom_timeout: 0.5
    sport_mode_timeout: 0.5
