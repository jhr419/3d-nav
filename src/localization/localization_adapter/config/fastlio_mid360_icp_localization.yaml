icp_localization_node:
  ros__parameters:
    # Backward-compatible fallback. If the two map paths below are empty, this
    # path is used for both visualization and ICP.
    map_pcd_path: "maps/map_preprocessed.pcd"
    # Optional lightweight map shown in RViz. If it is missing, the node falls
    # back to the ICP/preprocessed map.
    visualization_map_pcd_path: "maps/map_visualization.pcd"
    # Map used as the ICP registration target.
    icp_map_pcd_path: "maps/map_preprocessed.pcd"

    # map_pcd_path: "maps/glim_office_csf_map/full_map.pcd"
    # # Ground map shown in RViz for manual initial pose selection.
    # visualization_map_pcd_path: "maps/glim_office_csf_map/ground_map.pcd"
    # # Non-ground / feature map used as the ICP registration target.
    # icp_map_pcd_path: "maps/glim_office_csf_map/non_ground_map.pcd"

    odom_topic: "/Odometry"
    scan_topic: "/cloud_registered_body"
    initialpose_topic: "/initialpose"

    map_frame: "map"
    odom_frame: "odom"
    base_frame: "base_link"
    publish_tf: true
    publish_base_tf: true
    # Publish map->odom as the localized base pose and keep odom->base_link identity.
    odom_coincident_with_base: true
    publish_map_cloud: true

    # FAST-LIO /cloud_registered_body and /Odometry are already in FAST-LIO's
    # body frame after preprocess.input_rotation_rpy_rad is applied, so only
    # the base_link -> FAST-LIO body translation is applied here. Do not repeat
    # the Livox mounting roll/pitch.
    base_to_body_xyz: [-0.3, 0.0, -0.2]
    base_to_body_rpy: [0.0, 0.0, 0.0]

    # Set this true if you want localization to start from the pose below
    # instead of waiting for RViz/Nav2 /initialpose.
    use_initial_pose_param: false
    initial_pose_xyz: [5.93438, 5.90442, 0.0]
    initial_pose_rpy: [0.0, 0.0, 0.0]

    min_range: 0.5
    max_range: 60.0
    scan_leaf_size: 0.25
    map_leaf_size: 0.25
    min_scan_points: 120
    source_non_ground_filter_en: true
    source_non_ground_min_z: -0.2

    max_correspondence_distance: 2.0
    transformation_epsilon: 0.01
    euclidean_fitness_epsilon: 0.01
    max_iterations: 40
    fitness_score_threshold: 2.0
    relocalization_interval_s: 0.2
